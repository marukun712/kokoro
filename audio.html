<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.zinc.min.css">
  <title>kokoro - audio</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    .repo-card {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      line-height: 1.5;
      color: #ccc;
      backdrop-filter: blur(4px);
    }

    .repo-card a {
      color: #aaa;
    }
  </style>
</head>

<body>
  <div
    style="position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; z-index: 10;">
    <button type="button" id="btn-capture">capture</button>
    <button type="button" id="btn-low">low</button>
  </div>
  <div class="repo-card">
    <div><a href="https://github.com/marukun712/kokoro">@kokoro/rig</a> で動いています</div>
    <div> エンジニアファーストな人形キャラクター向けメッシュ変形ライブラリです。</div>
    <div>コントリビューション・star をお待ちしています</div>
  </div>
  <script type="module" src="./src/audio.ts"></script>
</body>

</html>
